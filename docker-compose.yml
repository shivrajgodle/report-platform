services:
  mongo:
    image: mongo:7
    container_name: report-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123   # local dev only; real secrets come from env vars
    volumes:
      - mongo-data:/data/db                  # keeps data after container restarts

volumes:
  mongo-data: