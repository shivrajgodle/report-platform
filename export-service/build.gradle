plugins {
	id 'org.springframework.boot'
}

// Aspose is not on Maven Central, so we add its own repository.
// content { includeGroup } restricts this repo to com.aspose only,
// so no other dependency can ever be resolved from it.
repositories {
	maven {
		url = uri('https://repository.aspose.com/repo/')
		content {
			includeGroup 'com.aspose'
		}
	}
}

dependencies {
	implementation project(':common')
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// Aspose.Cells = Excel. Slides and Imaging come in the next steps.
	// Check the Aspose repo for the newest version and bump if you like.
	implementation 'com.aspose:aspose-cells:24.10'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

// Aspose uses java.awt classes internally (colors, fonts, images).
// Headless mode tells the JVM there is no screen, which is the case on servers.
tasks.withType(JavaExec).configureEach {
	jvmArgs '-Djava.awt.headless=true'
}